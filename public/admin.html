<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>접수 관리 | 서비스 지원</title><link rel="stylesheet" href="/style.css"><script type="module" src="/admin.mjs"></script></head><body><header class="top"><a class="brand" href="/">SERVICE SUPPORT <span>접수 관리</span></a><button id="logout" class="quiet" hidden>로그아웃</button></header><main class="container admin"><p class="eyebrow">REPAIR DESK</p><h1>수리 접수 관리</h1><p class="subtle">접수 확인부터 PDF 다운로드까지 한곳에서.</p><p id="message" class="error" role="alert"></p>
<section id="login-panel" class="card"><h2>담당자 로그인</h2><p>관리자 비밀번호를 입력해 주세요.</p><form id="login"><label>비밀번호<input name="password" type="password" required maxlength="256" autocomplete="current-password"></label><button class="primary" type="submit">로그인</button></form><p class="subtle">로그인은 30분 동안 유지됩니다. 공용 PC에서는 이용 후 로그아웃해 주세요.</p></section>
<section id="dashboard" hidden><div class="toolbar"><h2 id="total">접수 목록</h2><button id="refresh" class="quiet">새로고침</button></div><div id="list" class="request-list"></div><div class="toolbar"><button id="prev" class="quiet">이전</button><span id="page"></span><button id="next" class="quiet">다음</button></div></section>
<section id="detail" class="card" hidden tabindex="-1"><div class="toolbar"><h2>신청서 상세</h2><button id="close" class="quiet">닫기</button></div><p id="detail-id" class="subtle receipt"></p><dl id="detail-content"></dl><div id="detail-terms"></div><label>처리 상태<select id="status"><option value="new">신규 접수</option><option value="reviewing">확인 중</option><option value="completed">처리 완료</option></select></label><div class="actions"><button id="save-status" class="quiet">상태 저장</button><button id="download" class="primary">PDF 다운로드</button><button id="delete" class="danger">접수 삭제</button></div><p class="subtle">내려받은 PDF에는 개인정보가 포함됩니다. 업무용 저장소에서 관리해 주세요.</p></section></main><footer>서비스센터 택배 수리 접수</footer></body></html>
